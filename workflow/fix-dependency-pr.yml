name: Fix dependency PR

on:
  workflow_run:
    # Edit: the workflows whose failures should be diagnosed.
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: fix-dependency-pr-${{ github.event.workflow_run.head_branch || inputs.pr }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RENOVATE_BOT: ${{ vars.FIX_DEPENDENCY_PR_RENOVATE_BOT || 'renovate[bot]' }}
    steps:
      - name: Check API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set (Actions and Dependabot secrets); skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the PR and check the bot rules
        id: pr
        if: steps.key.outputs.ok == 'true'
        env:
          INPUT_PR: ${{ inputs.pr }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          pr="${INPUT_PR:-$RUN_PR}"
          if [ -z "$pr" ]; then echo "::notice::No PR for this run."; echo "match=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          read -r branch author < <(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefName,author -q '"\(.headRefName) \(.author.login)"')
          # gh may report bots as "app/renovate" or "renovate[bot]"; normalize to the bare name.
          author="${author#app/}"; author="${author%\[bot\]}"
          prefix=$(gh api "repos/$GITHUB_REPOSITORY/contents/renovate.json" -q '.content' 2>/dev/null | base64 -d 2>/dev/null | jq -r '.branchPrefix // empty' 2>/dev/null)
          match=false
          case "$branch" in
            dependabot/*) [ "$author" = dependabot ] && match=true ;;
            renovate/*|"${prefix:-renovate/}"*) [ "$author" = "${RENOVATE_BOT%\[bot\]}" ] && match=true ;;
          esac
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "match=$match" >> "$GITHUB_OUTPUT"
          [ "$match" = true ] || echo "::notice::PR #$pr ($branch by $author) is not a Renovate/Dependabot PR; skipping."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.match == 'true'
        with:
          ref: ${{ steps.pr.outputs.branch }}

      # Replace with the project's own DDEV setup action if it has one.
      - uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1.12.1
        if: steps.pr.outputs.match == 'true'
        with:
          autostart: false

      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        if: steps.pr.outputs.match == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            /fix-dependency-pr ${{ steps.pr.outputs.number }}
            You are running in CI (comment-only mode): never commit, push or comment. Write the report to fix-dependency-pr-comment.md.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(ddev:*)"

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.pr.outputs.match == 'true' && hashFiles('fix-dependency-pr-comment.md') != ''
        with:
          header: fix-dependency-pr
          number: ${{ steps.pr.outputs.number }}
          path: fix-dependency-pr-comment.md
